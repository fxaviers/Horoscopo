name: Atualizar Horóscopo do Dia

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar atualização e tradução de todas as previsões'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-horoscopo
  cancel-in-progress: false

jobs:
  update-horoscopo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Executar pipeline de coleta e tradução (pt-BR)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          FORCE_UPDATE: ${{ inputs.force }}
        run: |
          if [ -f "scripts/update-horoscopo.mjs" ]; then
            SCRIPT_PATH="scripts/update-horoscopo.mjs"
          elif [ -f "horoscopo/scripts/update-horoscopo.mjs" ]; then
            SCRIPT_PATH="horoscopo/scripts/update-horoscopo.mjs"
          else
            echo "Erro: update-horoscopo.mjs não encontrado na raiz nem em horoscopo/." >&2
            exit 1
          fi

          if [ "${FORCE_UPDATE}" = "true" ]; then
            node "${SCRIPT_PATH}" --force
          else
            node "${SCRIPT_PATH}"
          fi

      - name: Commit e push se horoscopo.json mudou
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -f "scripts/update-horoscopo.mjs" ]; then
            DATA_PATH="data/horoscopo.json"
          elif [ -f "horoscopo/scripts/update-horoscopo.mjs" ]; then
            DATA_PATH="horoscopo/data/horoscopo.json"
          else
            echo "Erro: pasta de dados não encontrada." >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain -- "${DATA_PATH}")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${DATA_PATH}"
            git commit -m "chore(horoscopo): atualizar previsões em pt-BR"
            git pull --rebase origin "${TARGET_BRANCH}"
            git push origin "HEAD:${TARGET_BRANCH}"
          else
            echo "Nenhuma alteração em ${DATA_PATH}."
          fi
